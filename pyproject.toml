[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-device-metadata-delta"
version = "0.2.0"
description = "ECPA-bound generation-safe sparse StateAxis decode metadata patches"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext>=0.3,<0.4"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-device-metadata-delta" = "stateaxis_device_metadata_delta"

[project.entry-points."stateaxis.mod_handlers"]
device_metadata_delta = "stateaxis_device_metadata_delta:device_metadata_delta"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_device_metadata_delta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
